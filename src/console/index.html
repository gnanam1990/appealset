<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AppealSet Console</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <strong>AppealSet</strong>
      <span class="brand-sub">adjudication console</span>
    </div>
    <div class="session" id="session-ui">
      <span id="signed-in" hidden>
        Acting as <strong id="session-name"></strong>
        <span id="session-note" class="muted"></span>
        <button class="secondary" id="signout-btn" type="button">Sign out</button>
      </span>
      <span id="signed-out">
        <label for="actor-select">Demo roster</label>
        <select id="actor-select" hidden></select>
        <label for="token-input">Credential</label>
        <input id="token-input" type="password" placeholder="apsk_…" autocomplete="off">
        <button class="secondary" id="signin-btn" type="button">Sign in</button>
      </span>
    </div>
  </header>

  <div class="layout">
    <nav class="sidenav" aria-label="Work surfaces">
      <ul id="nav-list"></ul>
    </nav>
    <main id="main" tabindex="-1">
      <div id="status" role="status" aria-live="polite" class="status" hidden></div>
      <div id="view"></div>
    </main>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
